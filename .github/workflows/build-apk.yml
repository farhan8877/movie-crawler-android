
name: Build Movie Crawler APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'movie_crawler_android_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev \
            libssl-dev automake autopoint gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0 Cython==0.29.37

      - name: Extract Android project
        run: |
          unzip -q movie_crawler_android_source.zip -d extracted

          PROJECT_DIR=$(find extracted -name buildozer.spec -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Fix Android API compatibility
        run: |
          cd "$PROJECT_DIR"

          sed -i -E \
            's/^[[:space:]]*android\.minapi[[:space:]]*=.*/android.minapi = 24/' \
            buildozer.spec

          echo "Checking Android configuration:"
          grep -E '^android\.(minapi|api)' buildozer.spec

          if ! grep -q '^android.minapi = 24$' buildozer.spec; then
            echo "ERROR: Minimum API update failed"
            exit 1
          fi

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"

          export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1

          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Crawler-APK
          path: extracted/**/bin/*.apk
          if-no-files-found: error
          retention-days: 7
